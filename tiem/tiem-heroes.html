<title>Tiệm Heroes</title>
<style>
:root{
  --bg:#f6efe4; --panel:#fffaf2; --ink:#3b2f2a; --muted:#8a776b; --line:#e7d9c7;
  --accent:#d9774b; --accent-ink:#fff; --chip:#f1e4d2; --shadow:0 10px 30px rgba(80,50,30,.14);
  --ok:#4f9a6b; --warn:#e0a32e; --bad:#c9573f; --off:#9a8f86;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1c1714; --panel:#26201c; --ink:#f3e8dc; --muted:#b3a294; --line:#3a312a;
    --accent:#e48a5e; --accent-ink:#1c1714; --chip:#332a23; --shadow:0 10px 30px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1c1714; --panel:#26201c; --ink:#f3e8dc; --muted:#b3a294; --line:#3a312a;
  --accent:#e48a5e; --accent-ink:#1c1714; --chip:#332a23; --shadow:0 10px 30px rgba(0,0,0,.4);
  color-scheme: dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Nunito","Segoe UI",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1280px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
header h1{font-size:22px;margin:0;letter-spacing:.2px}
header .sub{color:var(--muted);font-size:13px}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--chip);font-size:13px;border:1px solid var(--line)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--off)}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.iconbtn{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px}
.iconbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}

.stage{position:relative;border-radius:18px;overflow:hidden;box-shadow:var(--shadow);background:#cfe6f3;aspect-ratio:16/9;user-select:none}
.stage>.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:filter 1.2s}
.stage svg.layer{position:absolute;inset:0;width:100%;height:100%}
.tint{position:absolute;inset:0;pointer-events:none;transition:background 1.2s,opacity 1.2s}
.demo{position:absolute;left:12px;top:12px;background:rgba(255,250,240,.9);color:#5a463b;padding:4px 10px;border-radius:999px;font-size:12px;display:none}

/* characters */
.char{cursor:pointer}
.char .hit{fill:transparent}
.char .bob{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 3.2s ease-in-out infinite}
.char:hover .figure,.char.sel .figure{filter:drop-shadow(0 0 5px rgba(255,244,210,1))}
.char.working:not(.walking) .bob{animation:work .6s ease-in-out infinite}
.char.waiting:not(.walking) .bob{animation:hop 1.1s ease-in-out infinite}
.char.done:not(.walking) .bob{animation:hop .7s ease-in-out infinite}
.char.offline .bob{animation:none}
.char.walking .bob{animation:walkbob .42s ease-in-out infinite}
.char.walking .leg-l{animation:stepA .42s ease-in-out infinite}
.char.walking .leg-r{animation:stepB .42s ease-in-out infinite}
.char.walking .arm-l{animation:swingA .42s ease-in-out infinite}
.char.walking .arm-r{animation:swingB .42s ease-in-out infinite}
.leg-l,.leg-r,.arm-l,.arm-r{transform-box:fill-box}
.char .eyes-closed{display:none}
.char.offline .eyes-open{display:none}
.char.offline .eyes-closed{display:inline}
.bubble{transform-box:fill-box;transform-origin:50% 100%;animation:float 2.6s ease-in-out infinite}
.char.walking .bubble-wrap{opacity:.0}
.bubble-wrap{transition:opacity .4s}
.tag{font:700 12.5px "Nunito",system-ui,sans-serif}
.char .lbl{opacity:.0;transition:opacity .2s}
.char:hover .lbl,.char.sel .lbl,.stage.labels .char .lbl{opacity:1}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.03)}}
@keyframes work{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-9px)}}
@keyframes walkbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
@keyframes stepA{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes stepB{0%,100%{transform:translateY(-4px)}50%{transform:translateY(0)}}
@keyframes swingA{0%,100%{transform:translateX(-2.5px)}50%{transform:translateX(2.5px)}}
@keyframes swingB{0%,100%{transform:translateX(2.5px)}50%{transform:translateX(-2.5px)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(12px,-22px)}}
.zz{animation:zz 2.4s linear infinite}
.zz2{animation-delay:1.2s}
@keyframes sway{0%,100%{transform:rotate(5deg)}50%{transform:rotate(-5deg)}}
@keyframes drop{to{transform:translateY(120px)}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes fly{0%{transform:translate(0,0)}25%{transform:translate(30px,-14px)}50%{transform:translate(55px,6px)}75%{transform:translate(20px,18px)}100%{transform:translate(0,0)}}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);padding:10px 16px;border-radius:14px;opacity:0;transition:.3s;z-index:9;max-width:min(92vw,460px);font-size:14px}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

/* bottom area */
.grid{display:grid;grid-template-columns:1fr 340px;gap:16px;margin-top:16px}
.grid>*{min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
.card h2{font-size:15px;margin:0 0 8px}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.ro{min-width:0;display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);text-align:left}
.ro:hover{border-color:var(--accent)}
.ro .av{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:17px}
.ro b{display:block;font-size:14px}
.ro small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.feed{list-style:none;margin:0;padding:0;max-height:300px;overflow:auto}
.feed li{padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.feed time{color:var(--muted);font-size:12px;margin-right:6px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(30,20,10,.25);opacity:0;pointer-events:none;transition:.2s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:max(420px,50vw);max-width:100%;background:var(--panel);box-shadow:var(--shadow);transform:translateX(105%);transition:transform .25s ease;display:flex;flex-direction:column;z-index:5}
.drawer.open{transform:none}
.dh{display:flex;gap:12px;align-items:center;padding:16px;border-bottom:1px solid var(--line)}
.dh .av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:24px}
.dh h3{margin:0;font-size:18px}
.dh p{margin:0;color:var(--muted);font-size:13px}
.status{padding:12px 16px;border-bottom:1px solid var(--line);font-size:14px}
.status .row{display:flex;gap:8px;margin:2px 0}
.status .k{color:var(--muted);width:78px;flex:none}
.tabs{display:flex;gap:6px;padding:10px 16px 0}
.tabs button{background:none;border:none;padding:6px 10px;border-bottom:2px solid transparent;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent);font-weight:700}
.pane{flex:1;overflow:auto;padding:12px 16px;display:none}
.pane.on{display:block}
.msg{margin:8px 0;padding:9px 12px;border-radius:14px;max-width:88%;white-space:pre-wrap;font-size:14px}
.msg.me{background:var(--accent);color:var(--accent-ink);margin-left:auto;border-bottom-right-radius:4px}
.msg.ai{background:var(--chip);border-bottom-left-radius:4px}
.msg.note{background:none;color:var(--muted);font-size:12px;text-align:center;max-width:100%}
.composer{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.composer textarea{flex:1;resize:none;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:10px;font:inherit}
.send{background:var(--accent);color:var(--accent-ink);border:none;border-radius:12px;padding:0 16px;font-weight:700}
.send:disabled{opacity:.5;cursor:default}
.job{border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:8px 0;font-size:13px;background:var(--bg)}
.job .st{font-size:12px;color:var(--muted)}
.hint{color:var(--muted);font-size:12px;margin:4px 0 0}
.projpick{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px 0;border-top:1px solid var(--line)}
.projpick .lab{width:100%;font-size:12px;color:var(--muted)}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 10px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.job .pj{font-size:12px;color:var(--muted)}
.code{font:700 12px ui-monospace,Menlo,monospace;background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-right:6px;user-select:all}
.hfilters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.hfilters input,.hfilters select{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:7px 10px;font:inherit;font-size:14px}
.hfilters input{flex:1;min-width:200px}
.hlist{max-height:520px;overflow:auto}
.hrow{border-bottom:1px dashed var(--line);padding:10px 0;cursor:pointer}
.hrow .t{font-weight:700}
.hrow .m{font-size:12px;color:var(--muted)}
.hrow .r{display:none;white-space:pre-wrap;font-size:13.5px;margin-top:6px;background:var(--bg);border-radius:10px;padding:8px 10px}
.hrow.open .r{display:block}
.job.basket{border-style:dashed;border-color:var(--accent)}
.job ol{margin:4px 0 0;padding-left:20px}
.modesel{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:6px 8px;font:inherit;font-size:13px}
.attachbar{display:flex;flex-wrap:wrap;gap:6px;padding:8px 16px 0}
.attachbar .chip{font-size:12px}
.attachbar a{font-size:12px;color:var(--accent)}
#attachBtn{align-self:center;padding:8px 10px;font-size:16px}
.close{margin-left:auto;background:none;border:none;font-size:22px;color:var(--muted)}

@media (max-width: 860px){
  .grid{grid-template-columns:1fr}
  .scroller{overflow-x:auto;border-radius:18px;box-shadow:var(--shadow);-webkit-overflow-scrolling:touch}
  .scroller .stage{width:820px;box-shadow:none;border-radius:0}
  .roster{grid-template-columns:1fr 1fr}
  .ro small{max-width:100%}
  .ro>span:last-child{min-width:0}
}
</style>

</aside>

function bubbleFor(st){

function routeTo(act, target){
  const pts = [];
  if(inCafe(act) !== inCafe(target)) pts.push(DOOR);
  pts.push(target); act.path = pts;
}
function updateActors(initial){
  for(const a of AGENTS){
    const act = actors[a.id]; if(!act) continue;
    const st = effState(a.id);
    const mode = (st==="offline") ? "rest" : (st==="idle" ? "wander" : (st==="done" ? "celebrate" : "work"));
    act.el.setAttribute("aria-label", `${a.name}: ${STATES[st].label}`);
    act.el.classList.remove(...Object.keys(STATES)); act.el.classList.add(st);
    act.el.querySelector(".bubble-wrap").innerHTML = bubbleFor(st);
    if(mode !== act.mode){
      act.mode = mode; act.wait = 0;
      const dest = mode==="rest" ? REST[a.id] : mode==="work" ? STATIONS[a.id] : mode==="celebrate" ? pickLeisure(a.id, false) : null;
      if(initial && dest){ act.x=dest.x; act.y=dest.y; act.path=[]; }
      else if(dest) routeTo(act, dest);
      else if(initial){ const p=pickLeisure(a.id,true); act.x=p.x; act.y=p.y; act.wait=2+Math.random()*6; }
    }
  }
  const h = actors.hero; if(h){ h.el.classList.add("idle"); h.el.setAttribute("aria-label","Hero"); }
  place();
}
function pickLeisure(id, allowCafe){
  const opts = LEISURE.filter(p=>allowCafe || !p.cafe);
  return opts[Math.floor(Math.random()*opts.length)];
}
function place(){
  const order = Object.entries(actors).sort((p,q)=>p[1].y-q[1].y);
  const svg = $("#chars");
  for(const [id,act] of order){
    const s = id==="hero" ? .5 : depth(act.y);
    act.el.setAttribute("transform", `translate(${act.x.toFixed(1)},${act.y.toFixed(1)})`);
    act.el.querySelector(".sc").setAttribute("transform", `scale(${s.toFixed(3)})`);
    act.el.querySelector(".flip").setAttribute("transform", `scale(${act.face},1)`);
    act.el.classList.toggle("walking", act.moving);
    svg.appendChild(act.el);   // z-order by depth
  }
}
let lastT = performance.now(), lastOrder = 0;
function tick(now){
  const dt = Math.min(.1, (now-lastT)/1000); lastT = now;
  let changed = false;
  for(const a of AGENTS){
    const act = actors[a.id]; if(!act) continue;
    if(act.path.length){
      const t = act.path[0], dx=t.x-act.x, dy=t.y-act.y, d=Math.hypot(dx,dy);
      const sp = 70*depth(act.y)*dt*1.6;
      if(d <= sp){ act.x=t.x; act.y=t.y; act.path.shift(); if(!act.path.length){ act.moving=false; act.wait = act.mode==="wander"?5+Math.random()*9:(act.mode==="celebrate"?4:0); act.face = act.mode==="work"||act.mode==="rest" ? 1 : act.face; } }
      else { act.x += dx/d*sp; act.y += dy/d*sp; act.moving=true; if(Math.abs(dx)>1) act.face = dx<0?-1:1; }
      changed = true;
    } else if(act.mode==="wander" || act.mode==="celebrate"){
      act.wait -= dt;
      if(act.wait<=0){ routeTo(act, pickLeisure(a.id, act.mode==="wander")); act.wait=0; }
    }
  }
  if(changed) place();
  requestAnimationFrame(tick);
}

/* ===== MUSIC (generated lo-fi) ===== */
let ac=null, musicOn=false, musicTimer=null, musicOut=null;
function lofi(){
  const h = vnNow().getHours(); const night = h>=19||h<6, morning = h>=6&&h<11;
  const prog = night ? [[57,60,64,67],[53,57,60,64],[55,59,62,65],[52,55,59,62]]
            : morning ? [[60,64,67,71],[57,60,64,67],[53,57,60,64],[55,59,62,67]]
            : [[62,65,69,72],[55,59,62,65],[60,64,67,71],[57,60,64,67]];
  const bpm = night?62:morning?78:72, beat=60/bpm;
  const out = ac.createGain(); out.gain.value=.16;
  const lp = ac.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value= night?1100:1700;
  out.connect(lp).connect(ac.destination);
  let t = ac.currentTime+.1, bar=0; const f = m => 440*Math.pow(2,(m-69)/12);
  function note(m, start, dur, vol, type="triangle"){ const o=ac.createOscillator(), g=ac.createGain(); o.type=type; o.frequency.value=f(m);
    g.gain.setValueAtTime(0,start); g.gain.linearRampToValueAtTime(vol,start+.04); g.gain.exponentialRampToValueAtTime(.001,start+dur); o.connect(g).connect(out); o.start(start); o.stop(start+dur+.05); }
  function noiseHit(start, vol){ const b=ac.createBuffer(1,ac.sampleRate*.05,ac.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length); const s=ac.createBufferSource(), g=ac.createGain(); s.buffer=b; g.gain.value=vol; s.connect(g).connect(out); s.start(start); }
  function schedule(){ while(t < ac.currentTime+2){ const ch = prog[bar%4];
      ch.forEach((m,i)=>note(m, t+i*.03, beat*4, .05)); note(ch[0]-12, t, beat*2, .09, "sine"); note(ch[0]-12, t+beat*2, beat*2, .07, "sine");
      for(let b=0;b<8;b++){ if(Math.random()<.55) note(ch[(b*3+bar)%4]+12, t+b*beat/2, beat*.8, .025, "sine"); noiseHit(t+b*beat/2, b%2?.03:.05); }
      t += beat*4; bar++; } }
  schedule(); musicTimer = setInterval(schedule, 500); return out;
}
$("#musicBtn").onclick = e => {
  musicOn=!musicOn; e.currentTarget.setAttribute("aria-pressed",musicOn);
  if(musicOn){ ac = ac || new (window.AudioContext||window.webkitAudioContext)(); ac.resume(); musicOut = lofi(); }
  else { clearInterval(musicTimer); if(musicOut){ const o=musicOut; o.gain.setTargetAtTime(0,ac.currentTime,.3); setTimeout(()=>o.disconnect(),1500);} }
};

let quayMap = {};                                     // meta/quay: {<agent or project>: trig_...}
let mcp = null;
function quayFor(j){ for(const k of [j.agent, ...(j.projects||[])]) if(quayMap[k]) return quayMap[k]; return quayMap.default || QUAY_DEFAULT; }
async function fireJob(j){
  if(!mcp){ toast("Trang chưa được phép gọi quầy · việc nằm chờ, báo cáo chiều sẽ vét"); return false; }
  const text = `VIỆC ${jobCode(j)} — ${(findAgent(j.agent)?.name||j.agent)}: ${String(j.text).replace(/\s+/g," ").slice(0,70)}\nJOB_ID: ${j.id}\nMÃ VIỆC: ${jobCode(j)} (ghi mã này ở dòng đầu câu trả lời cuối, trong reply và trong Sổ giao việc)\nAgent: ${j.agent}\nDự án: ${(j.projects||[]).join(", ")}\nNội dung việc:\n${j.text}${(j.files||[]).length?`\nTỆP ĐÍNH KÈM (OneDrive, đọc bằng connector Microsoft 365 read_resource):\n`+j.files.map(f=>`- ${f.name} · file:///${f.driveId}/${f.itemId} · ${f.url}`).join("\n"):""}`;
  try{ await mcp.callTool("Claude Code Remote","fire_trigger",{trigger_id:quayFor(j), text}, {cache:false}); return true; }
  catch(e){ toast("Chưa gọi được quầy ("+(e?.code||"lỗi")+") · việc vẫn nằm chờ"); return false; }
}
function linkify(t){ return esc(t).replace(/https?:\/\/[^\s<]+/g, u=>`<a href="${u}" target="_blank" rel="noopener">${u}</a>`); }

   + (mine.length? mine.map(j=> j.status==="gio" ? `<div class="job basket"><span class="code">${esc(jobCode(j))}</span><b>🧺 Giỏ việc chưa gửi</b> · ${(j.items||[]).length} việc<ol>${(j.items||[]).map((it,i)=>`<li>${esc(it.text)} <button class="chip" style="padding:0 6px" data-rmitem="${j.id}:${i}" title="Bỏ việc này">×</button></li>`).join("")}</ol>${(j.projects||[]).length?`<div class="pj">${j.projects.map(k=>esc(PROJECTS[k]||k)).join(" · ")}</div>`:""}<button class="send" style="margin-top:8px;padding:6px 14px" data-sendbasket="${j.id}">Gửi cả giỏ</button></div>` : `<div class="job"><div style="white-space:pre-wrap"><span class="code" title="Mã việc — dùng để tìm lại">${esc(jobCode(j))}</span>${esc(j.text)}</div>${(j.files||[]).length?`<div class="pj">📎 ${j.files.map(f=>`<a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.name)}</a>`).join(" · ")}</div>`:""}${(j.projects||[]).length?`<div class="pj">${j.projects.map(k=>esc(PROJECTS[k]||k)).join(" · ")}</div>`:""}<div class="st">${JOB_ST[j.status]||esc(j.status)} · giao ${fmtTime(j.createdAt)}${j.doneAt?" · xong "+fmtTime(j.doneAt):""}${j.by_agent?" · "+esc(findAgent(j.by_agent)?.name||j.by_agent):""}</div>${j.reply?`<div style="margin-top:6px;white-space:pre-wrap">↳ ${linkify(j.reply)}</div>`:""}<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">${j.status==="cho"?`<button class="chip" data-refire="${j.id}">↻ Gọi quầy lại</button>`:""}${j.status==="cho-mac"?`<button class="chip" data-firemac="1">🖥 Gọi Quầy Mac</button>`:""}${["cho","cho-mac","cho-hero","can-xem"].includes(j.status)?`<button class="chip" data-closejob="${j.id}" title="Đánh dấu xong / bỏ việc này">✓ Đóng việc</button>`:""}</div></div>`).join("") : `<p class="hint">Chưa có việc nào cho ${esc(findAgent(id).name)}.</p>`);
}

const CODE_PREFIX = {"noi-tro":"NT","phien-dich":"PD","sidekick":"SK","hoa-tieu":"HT","kien-truc-su":"KT","tho-may":"TM","tho-xay":"TX","tho-san":"TS","gac-cong":"GC","hat-rong":"HR"};
function makeCode(agent){ const d=vnNow(); const p=n=>String(n).padStart(2,"0"); const r=Math.random().toString(36).slice(2,5).toUpperCase(); return `${CODE_PREFIX[agent]||"VC"}-${p(d.getDate())}${p(d.getMonth()+1)}-${r}`; }
const jobCode = j => j.code || ("#"+j.id.slice(0,6));
function basketText(items){ return items.map((it,i)=>`${i+1}. ${it.text}`).join("\n"); }
async function addToBasket(text){
  const now = Date.now();
  if(sendMode==="new"){
    const ref = await db.collection("inbox").add({agent:current, code:makeCode(current), status:"gio", items:[{text, at:now}], text:basketText([{text}]), projects:[...pickProj], createdAt:now, by:meId||""});
    sendMode = ref.id; toast("Đã tạo giỏ mới · thêm việc rồi bấm \"Gửi cả giỏ\"");
  } else {
    const ref = db.collection("inbox").doc(sendMode); const d = await ref.get();
    if(!d.exists || d.data().status!=="gio"){ toast("Giỏ này đã gửi đi rồi · chọn giỏ khác hoặc giao ngay"); sendMode="now"; renderModePick(); return; }
    const items = [...(d.data().items||[]), {text, at:now}];
    const projects = [...new Set([...(d.data().projects||[]), ...pickProj])];
    await ref.update({items, text:basketText(items), projects});
    toast(`Đã thêm vào giỏ · giỏ có ${items.length} việc`);
  }
}
async function sendBasket(id){
  const ref = db.collection("inbox").doc(id); const d = await ref.get();
  if(!d.exists || d.data().status!=="gio") return;
  const data = d.data(); const createdAt = Date.now();
  await ref.update({status:"cho", sentAt:createdAt, text:basketText(data.items||[])});
  if(sendMode===id) sendMode="now";
  toast(`Đã gửi giỏ ${data.items.length} việc · đang gọi quầy…`);
  if(await fireJob({id, ...data, text:"GIỎ VIỆC — làm lần lượt trong cùng phiên này, mỗi việc báo kết quả riêng trong reply và ghi Sổ giao việc mỗi việc một dòng:\n"+basketText(data.items||[])})) toast("✅ Quầy đã nhận giỏ việc");
}
document.addEventListener("click", async e=>{
  const b=e.target.closest("[data-sendbasket]"); if(b){ b.disabled=true; try{ await sendBasket(b.dataset.sendbasket); }catch(err){ toast("Không gửi được giỏ ("+(err?.code||"lỗi")+")"); } b.disabled=false; return; }
  const r=e.target.closest("[data-rmitem]"); if(r){ const [id,ix]=r.dataset.rmitem.split(":"); const j=jobs.find(x=>x.id===id); if(!j||j.status!=="gio") return;
    const items=(j.items||[]).filter((_,i)=>i!==Number(ix)); try{ if(items.length) await db.collection("inbox").doc(id).update({items, text:basketText(items)}); else { await db.collection("inbox").doc(id).update({status:"huy", items:[]}); } }catch(err){ toast("Không xoá được ("+(err?.code||"lỗi")+")"); } }
});

const OD = {drive:"b!Kcb-fGsOpEmb5iaiiucjLtnOthFAeFRNvGcH9_CoJPRly4i-9jz_RJ5-ur1lOgYI", folder:"01VSB3G5JUNWIZPLYB6RHLQNNKJLWFCRA6",

let pendingFiles = [];
function renderAttach(){
  const bar=$("#attachBar"); const show = tab==="job";
  bar.hidden = !show;
  if(!show) return;
  bar.innerHTML = pendingFiles.map((f,i)=>`<span class="chip">📄 ${esc(f.name)} · ${(f.size/1024).toFixed(0)} KB <button class="chip" style="padding:0 6px" data-rmfile="${i}">×</button></span>`).join("")
    + `<a href="${OD.web}" target="_blank" rel="noopener">📂 Tệp lớn (> 1 MB): mở thư mục Tệp giao việc, bỏ tệp vào rồi dán link vào nội dung việc</a>`;
  bar.querySelectorAll("[data-rmfile]").forEach(b=>b.onclick=()=>{ pendingFiles.splice(Number(b.dataset.rmfile),1); renderAttach(); });

$("#attachFile").onchange = e=>{
  for(const f of e.target.files){ if(f.size > 1048576){ toast(`"${f.name}" lớn hơn 1 MB · bỏ vào thư mục Tệp giao việc trên OneDrive rồi dán link nhé`); continue; } pendingFiles.push(f); }
  e.target.value=""; renderAttach();
};
function b64(buf){ let s=""; const a=new Uint8Array(buf); for(let i=0;i<a.length;i+=0x8000) s+=String.fromCharCode.apply(null, a.subarray(i,i+0x8000)); return btoa(s); }
async function uploadFiles(code){
  const out=[];
  for(const f of pendingFiles){
    const filename = `${code}_${f.name}`.replace(/[\\/:*?"<>|]/g,"_");
    const r = await mcp.callTool("Microsoft 365","sharepoint_upload_file",{driveId:OD.drive, parentItemId:OD.folder, filename, contentBase64:b64(await f.arrayBuffer()), conflictBehavior:"rename"},{cache:false});
    const txt = typeof r.payload==="string" ? r.payload : JSON.stringify(r.payload ?? r);
    const itemId = (txt.match(/itemId:\s*(\S+)/)||txt.match(/"id"\s*:\s*"([^"]+)"/)||[])[1] || "";
    const web = (txt.match(/webUrl:\s*(\S+)/)||txt.match(/"webUrl"\s*:\s*"([^"]+)"/)||[])[1] || OD.web;
    out.push({name:filename, size:f.size, itemId, url:web, driveId:OD.drive});
  }
  return out;
}
async function sendJob(text){
  if(!db){ renderJobs(); return; }
  if(!pickProj.size){ toast("Chọn ít nhất 1 dự án để agent biết đọc tài liệu nào"); $("#input").value=text; return; }
  if(sendMode!=="now"){ try{ await addToBasket(text); }catch(e){ toast("Không lưu được ("+(e?.code||"lỗi")+")"); $("#input").value=text; } return; }
  try{
    const code = makeCode(current);
    let files = [];
    if(pendingFiles.length){
      if(!mcp){ toast("Trang chưa được phép dùng Microsoft 365 để tải tệp"); $("#input").value=text; return; }
      toast("Đang tải "+pendingFiles.length+" tệp lên OneDrive…");
      try{ files = await uploadFiles(code); }catch(e){ toast("Không tải được tệp ("+(e?.code||"lỗi")+") · việc chưa giao"); $("#input").value=text; return; }
      pendingFiles = []; renderAttach();
    }
    const data = {agent:current, code, text, files, projects:[...pickProj], status:"cho", createdAt:Date.now(), by:meId||""};
    const ref = await db.collection("inbox").add(data);
    toast("Đã giao cho "+findAgent(current).name+" · đang gọi quầy…");
    if(await fireJob({id:ref.id, ...data})) toast("✅ "+quayName(data)+" đã nhận lệnh · "+findAgent(data.agent).name+" bắt đầu ngay (chạy trên cloud). Việc cần Mac sẽ được chuyển sang Quầy Mac.");
  }
  catch(e){ $("#pJob").insertAdjacentHTML("afterbegin", `<p class="hint">⚠️ Không lưu được (${esc(e?.code||"lỗi")}).</p>`); }
}

(async ()=>{
  if(!window.claude?.use) return;
  [db, sample, user, assets, mcp] = await Promise.all(["db","sample","user","assets","mcp"].map(n=>claude.use(n).catch(()=>null)));
  if(user){ try{ meId = await user.id(); }catch{} }
  if(assets && user){ try{ if(await user.canEdit()) $("#bgBtn").hidden = false; }catch{} }
  if(!db) return;
  let got = false;
  const timer = setTimeout(()=>{ if(!got) $("#demo").textContent="Chưa kết nối được dữ liệu · đang thử lại"; }, 10000);
  db.collection("agents").onSnapshot(snap=>{
    got = true; if(!snap.metadata.fromCache) clearTimeout(timer);
    const next = {}; snap.docs.forEach(d=>{ next[d.id] = d.data(); });
    if(snap.size){ status = next; live = true; $("#demo").style.display="none"; }
    renderAll();
  }, ()=>clearTimeout(timer));
  db.doc("feed/log").onSnapshot(d=>{ feed = (d.exists && Array.isArray(d.data().items)) ? d.data().items : []; renderFeed(); }, ()=>{});
  db.doc("meta/mac").onSnapshot(d=>{ macSeen = d.exists ? Number(d.data().lastSeen)||0 : 0; renderMac(); }, ()=>{});
  db.doc("meta/quay").onSnapshot(d=>{ quayMap = d.exists ? d.data() : {}; }, ()=>{});
  db.doc("meta/scene").onSnapshot(d=>{ if(d.exists && d.data().bgUrl) setBg(d.data().bgUrl); }, ()=>{});
  let firstJobs = true; const prevSt = {};
  db.collection("inbox").orderBy("createdAt","desc").limit(100).onSnapshot(snap=>{
    jobs = snap.docs.map(d=>({id:d.id, ...d.data()}));
    if(!firstJobs){
      for(const j of jobs){
        if(prevSt[j.id] && prevSt[j.id]!==j.status){
          const nm = findAgent(j.agent)?.name || j.agent;
          if(j.status==="xong"||j.status==="can-xem"){ toast(`✅ ${nm} đã xong: ${j.text.slice(0,60)}`); chats[j.agent]=chats[j.agent]||[]; chats[j.agent].push({role:"assistant", sys:true, content:`✅ Việc "${j.text.slice(0,80)}" đã xong. Xem kết quả ở tab Giao việc.`}); if(current===j.agent && tab==="chat") renderChat(); }
          if(j.status==="dang-lam") toast(`✨ ${nm} đã nhận việc`);
          if(j.status==="cho-hero") toast(`❗ ${nm} cần cậu trả lời · xem tab Giao việc`);
        }
      }
    }
    jobs.forEach(j=>prevSt[j.id]=j.status); firstJobs=false;
    renderRoster(); renderHistory(); if(current && tab==="job"){ renderJobs(); renderModePick(); }
  }, ()=>{});
})();
